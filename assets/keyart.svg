<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e12"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="37%" r="52%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffcc00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f5b301"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="720" height="1080" fill="url(#bg)"/>
  <rect width="720" height="1080" fill="url(#dots)"/>
  <rect width="720" height="1080" fill="url(#glow)"/>

  <!-- anillos finos alrededor del rombo -->
  <circle cx="360" cy="400" r="252" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="360" cy="400" r="336" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
  <circle cx="360" cy="400" r="420" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>

  <!-- rombo de la marca (mismo motivo del favicon) -->
  <g transform="translate(360 400)">
    <path d="M0 -190 L160 0 L0 190 L-160 0 Z" fill="url(#dia)"/>
    <circle r="78" fill="#09090b"/>
    <circle r="40" fill="#ffffff"/>
  </g>

  <!-- línea horizontal sutil bajo el rombo -->
  <line x1="120" y1="700" x2="600" y2="700" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
