<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Bling</title>
    <style>
      /*
       * Barra de las ventanas de servicio. Mismo lenguaje que la titlebar del
       * hub (36 px, #09090b, acento #ffcc00) para que una ventana de Bling
       * Social se sienta parte del launcher y no un navegador suelto.
       */
      :root {
        --acento: #ffcc00;
        --sans: "Montserrat", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 36px;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-left: 6px;
        background: #09090b;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        color: #fff;
        font-family: var(--sans);
        -webkit-app-region: drag;
        user-select: none;
      }
      button {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        cursor: default;
        transition:
          background-color 0.12s,
          color 0.12s;
      }
      button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
      }
      button:disabled {
        opacity: 0.28;
      }
      /* Sin anillo de foco suelto al abrir; con teclado sí se marca. */
      button:focus {
        outline: none;
      }
      button:focus-visible {
        outline: 1px solid rgb(255 204 0 / 0.55);
        outline-offset: -1px;
      }
      #recargar.cargando svg {
        animation: girar 0.9s linear infinite;
        color: var(--acento);
      }
      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }

      .titulo {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        margin-left: 6px;
      }
      /* Aviso de que la página no cargó: el nombre del servicio solo no
         cuenta que hay algo mal, así que se dice. */
      .aviso {
        flex: none;
        padding: 2px 7px;
        border: 1px solid rgb(255 204 0 / 0.35);
        border-radius: 999px;
        background: rgb(255 204 0 / 0.1);
        color: var(--acento);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .aviso[hidden] {
        display: none;
      }
      .punto {
        width: 5px;
        height: 5px;
        flex: none;
        border-radius: 999px;
        background: var(--acento);
      }
      #titulo {
        overflow: hidden;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.8);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .relleno {
        flex: 1;
      }

      /* Aviso de carga: una línea de acento al pie de la barra. */
      .progreso {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 2px;
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .progreso.activo {
        opacity: 1;
      }
      .progreso::after {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: var(--acento);
        animation: correr 1.1s ease-in-out infinite;
      }
      @keyframes correr {
        to {
          left: 100%;
        }
      }

      /* Controles de ventana: mismo ancho y hovers que los del hub. */
      .ventana {
        display: flex;
        align-self: stretch;
        margin-left: 2px;
      }
      .ventana button {
        width: 44px;
        height: 100%;
        border-radius: 0;
        color: rgba(255, 255, 255, 0.5);
      }
      .ventana button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      #cerrar:hover {
        background: rgb(239 68 68 / 0.9);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <button id="atras" title="Atrás" aria-label="Atrás" disabled>
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
    <button id="adelante" title="Adelante" aria-label="Adelante" disabled>
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
    <button id="recargar" title="Recargar" aria-label="Recargar">
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <path d="M21 3v6h-6" />
      </svg>
    </button>

    <div class="titulo">
      <span class="punto"></span>
      <span id="titulo">Bling</span>
      <span id="aviso" class="aviso" hidden>Sin conexión</span>
    </div>

    <span class="relleno"></span>

    <button id="externo" title="Abrir en el navegador" aria-label="Abrir en el navegador">
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        <path d="M15 3h6v6" />
        <path d="M10 14 21 3" />
      </svg>
    </button>

    <div class="ventana">
      <button id="minimizar" title="Minimizar" aria-label="Minimizar">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M5 12h14" />
        </svg>
      </button>
      <button id="maximizar" title="Maximizar" aria-label="Maximizar">
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="4" y="4" width="16" height="16" rx="2" />
        </svg>
      </button>
      <button id="cerrar" title="Cerrar" aria-label="Cerrar">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <div class="progreso" id="progreso"></div>
    <script src="./barra-servicio.js"></script>
  </body>
</html>
